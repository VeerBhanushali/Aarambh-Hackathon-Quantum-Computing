<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-label="Quantum Guard">
  <g>
  <defs>
    <linearGradient id="qg-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A44"/>
      <stop offset="1" stop-color="#0E1726"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M64 6 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="url(#qg-shield)" stroke="#4F8EF7" stroke-width="4" stroke-linejoin="round"/>
  <!-- Lattice (post-quantum = lattice cryptography) -->
  <g stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="42" y1="44" x2="86" y2="44"/><line x1="42" y1="64" x2="86" y2="64"/><line x1="42" y1="84" x2="86" y2="84"/>
    <line x1="42" y1="44" x2="42" y2="84"/><line x1="64" y1="44" x2="64" y2="84"/><line x1="86" y1="44" x2="86" y2="84"/>
    <line x1="42" y1="44" x2="64" y2="64"/><line x1="64" y1="64" x2="86" y2="84"/><line x1="64" y1="44" x2="86" y2="64"/><line x1="42" y1="64" x2="64" y2="84"/>
  </g>
  <g fill="#F3F1EA">
    <circle cx="42" cy="44" r="4"/><circle cx="64" cy="44" r="4"/><circle cx="86" cy="44" r="4"/>
    <circle cx="42" cy="64" r="4"/><circle cx="86" cy="64" r="4"/>
    <circle cx="42" cy="84" r="4"/><circle cx="64" cy="84" r="4"/><circle cx="86" cy="84" r="4"/>
  </g>
  <!-- Quantum orbit around the protected core -->
  <ellipse cx="64" cy="64" rx="34" ry="12" fill="none" stroke="#F2A541" stroke-width="3" transform="rotate(-30 64 64)"/>
  <circle cx="64" cy="64" r="7" fill="#F2A541"/>
  <circle cx="93.4" cy="47" r="4.5" fill="#F2A541"/>
</g>
  <text x="146" y="70" font-family="'Space Grotesk','IBM Plex Sans',Arial,sans-serif" font-size="50" font-weight="700" fill="#0E1726" letter-spacing="-1">Quantum<tspan fill="#2563EB"> Guard</tspan></text>
  <text x="148" y="102" font-family="'JetBrains Mono','Courier New',monospace" font-size="16" fill="#526075" letter-spacing="2">POST-QUANTUM READINESS</text>
</svg>
